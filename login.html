<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso — Never-Out</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        space:    '#030712',
                        graphite: '#0F172A',
                        panel:    '#1E293B',
                        neon:     '#00F2FE',
                        teal:     '#00ADB5',
                        violet:   '#8B5CF6',
                        indigo:   '#6366F1',
                        emerald2: '#10B981',
                        amber2:   '#F59E0B',
                        redneon:  '#EF4444',
                        techgray: '#94A3B8',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                        inter:   ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        neon:       '0 0 30px rgba(0,242,254,0.08)',
                        neonglow:   '0 0 45px rgba(0,242,254,0.35)',
                        violetglow: '0 0 45px rgba(139,92,246,0.30)',
                    },
                    animation: {
                        'pulse-red': 'pulseRed 1.4s ease-in-out infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        pulseRed: {
                            '0%,100%': { boxShadow: '0 0 0px rgba(239,68,68,0.1)' },
                            '50%':     { boxShadow: '0 0 35px rgba(239,68,68,0.55)' },
                        },
                        float: {
                            '0%,100%': { transform: 'translateY(0px)' },
                            '50%':     { transform: 'translateY(-14px)' },
                        },
                    },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #030712; font-family: 'Inter', sans-serif; }
        .grid-bg {
            background-image:
                linear-gradient(rgba(0,242,254,0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,242,254,0.045) 1px, transparent 1px);
            background-size: 44px 44px;
        }
        .text-gradient {
            background: linear-gradient(90deg, #00F2FE, #3B82F6, #8B5CF6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        ::-webkit-scrollbar { width: 9px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 8px; }
    </style>
</head>
<body class="text-white antialiased overflow-x-hidden">

<div class="min-h-screen grid-bg flex items-center justify-center p-6 relative">
    <!-- Resplandores de fondo -->
    <div class="absolute top-0 -left-32 w-96 h-96 bg-neon/10 rounded-full blur-[130px] pointer-events-none"></div>
    <div class="absolute bottom-0 -right-32 w-96 h-96 bg-violet/15 rounded-full blur-[130px] pointer-events-none"></div>

    <div class="relative w-full max-w-md">
        <!-- Logo + título -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-2.5 group mb-6">
                <div class="relative w-11 h-11 rounded-2xl bg-gradient-to-br from-neon to-indigo flex items-center justify-center shadow-neonglow">
                    <span class="text-space font-extrabold text-xl">N</span>
                    <span class="absolute inset-0 rounded-2xl border border-white/20"></span>
                </div>
                <span class="font-poppins font-bold text-2xl tracking-tight">Never<span class="text-neon">-Out</span></span>
            </a>
            <h1 class="font-poppins text-2xl font-bold">Acceso <span class="text-gradient">Seguro</span></h1>
            <p class="text-sm text-techgray mt-2">Autenticación inmersiva · Conexión cifrada extremo a extremo</p>
        </div>

        <!-- Tarjeta principal -->
        <div class="rounded-3xl border border-cyan-500/30 bg-graphite/70 backdrop-blur-xl p-8 shadow-neon">
            <!-- Formulario -->
            <form id="loginForm" class="space-y-5" onsubmit="return false;">
                <div>
                    <label for="email" class="block text-xs font-semibold text-techgray uppercase tracking-wider mb-2">Correo electrónico</label>
                    <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email"
                        class="w-full rounded-xl border border-panel bg-space/60 px-4 py-3.5 text-sm placeholder-techgray/50 outline-none focus:border-neon focus:shadow-neonglow transition-all duration-300">
                </div>
                <div>
                    <label for="password" class="block text-xs font-semibold text-techgray uppercase tracking-wider mb-2">Contraseña</label>
                    <div class="relative">
                        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"
                            class="w-full rounded-xl border border-panel bg-space/60 px-4 py-3.5 text-sm placeholder-techgray/50 outline-none focus:border-neon focus:shadow-neonglow transition-all duration-300">
                        <!-- Toggle de visibilidad -->
                        <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-techgray hover:text-neon transition-colors" aria-label="Mostrar contraseña">
                            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 5-1.274 2.057-5.064 5-9.542 5-4.477 0-8.268-2.943-9.542-5z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center gap-2 text-techgray cursor-pointer">
                        <input type="checkbox" class="rounded border-panel bg-space accent-cyan-400"> Recordarme
                    </label>
                    <a href="#" class="text-neon hover:text-white transition-colors">¿Olvidaste tu contraseña?</a>
                </div>
                <!-- Botón de acceso -->
                <button type="submit"
                    class="w-full rounded-xl bg-neon py-3.5 font-poppins font-bold text-space shadow-neonglow hover:bg-white transition-all duration-300 hover:scale-[1.02]">
                    Ingresar
                </button>
                <p class="text-center text-xs text-techgray">¿No tienes cuenta? <a href="#" class="text-neon hover:text-white transition-colors font-semibold">Regístrate</a></p>
            </form>
        </div>

        <!-- Accesos directos por rol -->
        <p class="text-center text-xs text-techgray uppercase tracking-widest mt-8 mb-4">— O ingresa directo como —</p>
        <div class="grid grid-cols-2 gap-4">
            <!-- Cliente -->
            <button onclick="ingresarComo('cliente')"
                class="group rounded-2xl border border-neon/40 bg-graphite/60 backdrop-blur-xl p-5 shadow-neon hover:shadow-neonglow hover:border-neon transition-all duration-300 text-center">
                <div class="w-11 h-11 mx-auto rounded-xl bg-neon/10 border border-neon/40 flex items-center justify-center text-xl mb-3 group-hover:scale-110 transition-transform">🏠</div>
                <p class="font-poppins font-bold text-sm">Cliente</p>
                <p class="text-[11px] text-techgray mt-1">Mi Nevera IoT</p>
            </button>
            <!-- Tendero -->
            <button onclick="ingresarComo('tendero')"
                class="group rounded-2xl border border-violet/40 bg-graphite/60 backdrop-blur-xl p-5 shadow-neon hover:shadow-violetglow hover:border-violet transition-all duration-300 text-center">
                <div class="w-11 h-11 mx-auto rounded-xl bg-violet/10 border border-violet/40 flex items-center justify-center text-xl mb-3 group-hover:scale-110 transition-transform">🏪</div>
                <p class="font-poppins font-bold text-sm">Tendero</p>
                <p class="text-[11px] text-techgray mt-1">Panel de Tienda</p>
            </button>
        </div>

        <p class="text-center text-[11px] text-techgray/60 mt-8">
            <a href="index.html" class="hover:text-neon transition-colors">← Volver al inicio</a>
        </p>
    </div>
</div>

<!-- Módulo compartido: sesión (RNF-005) y formato COP (RNF-017) -->
<script src="assets/app.js"></script>
<script>
    // Mostrar / ocultar contraseña
    function togglePassword() {
        const input  = document.getElementById('password');
        const icon   = document.getElementById('eyeIcon');
        const isPass = input.type === 'password';
        input.type   = isPass ? 'text' : 'password';
        icon.style.opacity = isPass ? '0.5' : '1';
    }

    // Redirección por rol (demo sin backend)
    // RNF-005: antes de redirigir se crea la sesión con token y
    // la contraseña se procesa con el hash simulado de app.js
    function ingresarComo(rol) {
        const password = document.getElementById('password').value;
        const hashDemo = NO.hashSimulado(password || 'demo'); // "cifrado" simulado
        console.log('[RNF-005] Hash simulado de contraseña:', hashDemo);
        NO.crearSesion(rol, rol === 'cliente' ? 'Juan Carlos' : 'Tienda Don Pepe');
        window.location.href = rol === 'cliente' ? 'cliente/dashboard.html' : 'tendero/panel.html';
    }

    // Envío del formulario -> valida credenciales y crea sesión de cliente
    document.getElementById('loginForm').addEventListener('submit', function () {
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        if (!email || !password) {
            // Resaltar campos vacíos
            document.getElementById('email').classList.add('border-redneon');
            document.getElementById('password').classList.add('border-redneon');
            setTimeout(() => {
                document.getElementById('email').classList.remove('border-redneon');
                document.getElementById('password').classList.remove('border-redneon');
            }, 1800);
            return;
        }
        // RNF-005: hash de la contraseña antes de "enviarla" al servidor
        console.log('[RNF-005] Enviando hash (nunca texto plano):', NO.hashSimulado(password));
        NO.crearSesion('cliente', email);
        window.location.href = 'cliente/dashboard.html';
    });
</script>
</body>
</html>
